<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ace Connect home preview</title>
  <desc id="desc">Illustrated preview of the Ace Connect homepage with department and quick-access cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)" />
  <rect width="1440" height="74" fill="#0d6efd" />
  <text x="118" y="46" fill="#ffffff" font-size="28" font-family="Georgia, serif" font-weight="700">ACECONNECT</text>
  <text x="720" y="150" text-anchor="middle" fill="#0f172a" font-size="48" font-family="Arial, sans-serif" font-weight="700">Departments</text>
  <text x="720" y="194" text-anchor="middle" fill="#64748b" font-size="24" font-family="Arial, sans-serif">Frontend + backend + sessions + student CRUD</text>
  <rect x="170" y="250" width="1100" height="170" rx="28" fill="#ffffff" stroke="#dbe3ef" />
  <text x="210" y="302" fill="#0f172a" font-size="28" font-family="Georgia, serif" font-weight="700">Quick Access</text>
  <text x="210" y="338" fill="#64748b" font-size="22" font-family="Arial, sans-serif">Direct links to cohort browsing, profile editing, and admin tools.</text>
  <rect x="210" y="360" width="300" height="110" rx="22" fill="#f8fbff" stroke="#dbe3ef" />
  <rect x="570" y="360" width="300" height="110" rx="22" fill="#f8fbff" stroke="#dbe3ef" />
  <rect x="930" y="360" width="300" height="110" rx="22" fill="#f8fbff" stroke="#dbe3ef" />
  <text x="240" y="407" fill="#0f172a" font-size="26" font-family="Arial, sans-serif" font-weight="700">Browse CSE Cohorts</text>
  <text x="240" y="442" fill="#64748b" font-size="20" font-family="Arial, sans-serif">Start from the homepage.</text>
  <text x="600" y="407" fill="#0f172a" font-size="26" font-family="Arial, sans-serif" font-weight="700">Open Sample Profile</text>
  <text x="600" y="442" fill="#64748b" font-size="20" font-family="Arial, sans-serif">Jump to a seeded profile.</text>
  <text x="960" y="407" fill="#0f172a" font-size="26" font-family="Arial, sans-serif" font-weight="700">Open Admin Dashboard</text>
  <text x="960" y="442" fill="#64748b" font-size="20" font-family="Arial, sans-serif">Manage users and students.</text>
  <rect x="460" y="500" width="520" height="270" rx="30" fill="#ffffff" stroke="#dbe3ef" />
  <rect x="510" y="540" width="160" height="160" rx="24" fill="#e2e8f0" />
  <text x="720" y="585" text-anchor="middle" fill="#0f172a" font-size="40" font-family="Georgia, serif" font-weight="700">CSE</text>
  <text x="720" y="628" text-anchor="middle" fill="#334155" font-size="28" font-family="Arial, sans-serif">Computer Science and Engineering</text>
  <text x="720" y="676" text-anchor="middle" fill="#64748b" font-size="22" font-family="Arial, sans-serif">Browse batches, sections, roll numbers, and profiles.</text>
  <rect x="610" y="710" width="220" height="42" rx="21" fill="#eaf2ff" />
  <text x="720" y="738" text-anchor="middle" fill="#0d6efd" font-size="20" font-family="Arial, sans-serif" font-weight="700">Department Card</text>
</svg>
